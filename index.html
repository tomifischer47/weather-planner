<!doctype html>
<html lang="en">
<head>

<title>Electricity Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column of answer cards under a "now" strip and a price chart; phone first. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202a; --muted:#5d6a78; --line:#dde3ea;
  --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --good:#1d7a4c; --good-soft:#dff2e8; --warn:#a2620a; --warn-soft:#fbefd9; --bad:#b42a2a; --bad-soft:#f9e1e1;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#93a1b0; --line:#2a3440;
  --accent:#7aa8f0; --accent-soft:#1d2d47;
  --good:#5cc78f; --good-soft:#163527; --warn:#e8ae55; --warn-soft:#3a2d16; --bad:#f07a7a; --bad-soft:#3d1c1e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e6ebf0; --muted:#93a1b0; --line:#2a3440;
  --accent:#7aa8f0; --accent-soft:#1d2d47;
  --good:#5cc78f; --good-soft:#163527; --warn:#e8ae55; --warn-soft:#3a2d16; --bad:#f07a7a; --bad-soft:#3d1c1e;
  color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-ui);-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.05rem;font-weight:700;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.82rem}
button{font:inherit;color:inherit}
.refresh{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.85rem;cursor:pointer}
.refresh:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.now{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.now .big{font-size:2.3rem;font-weight:600;line-height:1}
.now .unit{color:var(--muted);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lv-good{color:var(--good);background:var(--good-soft)}
.lv-mid{color:var(--muted);background:var(--line)}
.lv-warn{color:var(--warn);background:var(--warn-soft)}
.lv-bad{color:var(--bad);background:var(--bad-soft)}

.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 4px}
.chart svg{display:block;width:100%;height:auto}
.chart .legend{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:.75rem;padding:4px 2px 2px;flex-wrap:wrap}

.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;width:100%}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .label{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .dur{font-size:.78rem;color:var(--muted)}
.card .answer{font-size:1.35rem;font-weight:600;line-height:1.2;text-wrap:balance}
.card .meta{color:var(--muted);font-size:.86rem}
.rows{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;font-size:.86rem}
.row span:first-child{color:var(--muted);min-width:0}
.row span:last-child{text-align:right;white-space:nowrap}
.pos{color:var(--good)} .negv{color:var(--bad)}
.days{display:flex;flex-direction:column;gap:6px}
.day{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem}
.empty{color:var(--muted);font-size:.9rem}

.err{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:12px 16px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.err .detail{font-size:.75rem;opacity:.85;overflow-wrap:anywhere;user-select:text}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s,box-shadow .15s}}
</style>

<body>
<main>
  <header>
    <h1>Electricity Planner</h1>
    <button class="refresh" id="refresh" type="button">Refresh</button>
  </header>

  <div id="error" class="err" hidden></div>

  <section class="now" aria-live="polite">
    <span class="big num" id="nowPrice">–</span>
    <span class="unit">c/kWh now</span>
    <span id="nowChip"></span>
  </section>

  <section class="chart" aria-label="Upcoming prices">
    <svg id="chart" viewBox="0 0 400 130" role="img" aria-label="Bar chart of upcoming 15-minute prices"></svg>
    <div class="legend"><span id="chartSel">Tap a card to highlight its time block</span><span>c/kWh</span></div>
  </section>

  <section class="cards" id="cards"></section>


</main>

<script id="logic">
/* ===== Pure logic (tested separately) ===== */
const SLOT = 15 * 60 * 1000;
const DAY = 24 * 60 * 60 * 1000;
const VAT = 1.255;
const TZ = "Europe/Helsinki";

// €/MWh excl. VAT -> c/kWh incl. VAT (no VAT on negative prices)
function eurMwhToCents(p) { const c = p / 10; return c > 0 ? c * VAT : c; }

const _fmtParts = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23", weekday: "short" });
function hk(t) {
  const o = {};
  for (const p of _fmtParts.formatToParts(new Date(t))) o[p.type] = p.value;
  return { key: `${o.year}-${o.month}-${o.day}`, h: +o.hour, m: +o.minute, wd: o.weekday, hm: `${o.hour}:${o.minute}` };
}

// Turn a map of ts->price into a sorted array of 15-min slots
function toSlots(map) { return [...map.entries()].map(([t, p]) => ({ t: +t, p })).sort((a, b) => a.t - b.t); }

// ===== Your appliances (hardcoded) =====
// Each profile is kWh drawn in each 15-minute slot of the run, so heating-heavy slots count more.
const PROFILE = (total, weights) => { const s = weights.reduce((a, b) => a + b, 0); return weights.map(w => total * w / s); };
const APPLIANCES = {
  // Siemens iQ100 SR415W00CS, Eco 50: 0.78 kWh over 195 min (official figures).
  // Water heating for the main wash early on and for the hot final rinse later carries most of the energy.
  dish: PROFILE(0.78, [0.02, 0.17, 0.17, 0.05, 0.02, 0.02, 0.02, 0.15, 0.15, 0.02, 0.01, 0.01, 0.01]),
  // Hoover VisionHD 6 kg at 40 °C: estimated 0.6 kWh (Hoover lists about 1.0 kWh for the 60 °C standard wash).
  // Water is heated in the first half hour; the rest is drum, pump and final spin.
  laundry: PROFILE(0.6, [0.40, 0.40, 0.04, 0.04, 0.04, 0.08]),
  // Worst-case dinner: hob's two largest zones (2.2 kW + 2.0 kW) on full for 1 h = 4.2 kWh,
  // plus the HB510AB.0S oven for a full hour including preheat, about 1.2 kWh (0.97 kWh per standard cycle).
  dinner: [1.05 + 0.45, 1.05 + 0.25, 1.05 + 0.25, 1.05 + 0.25],
};
const kwhOf = prof => prof.reduce((a, b) => a + b, 0);

// All contiguous windows of n slots: [{start, end, avg, cost}]
// With a profile, cost is € for that run and avg is the energy-weighted c/kWh.
function windows(slots, n, profile) {
  const out = [];
  const w = profile || Array(n).fill(1);
  const tot = kwhOf(w);
  for (let i = 0; i + n <= slots.length; i++) {
    if (slots[i + n - 1].t - slots[i].t !== (n - 1) * SLOT) continue;
    let s = 0; for (let j = 0; j < n; j++) s += slots[i + j].p * w[j];
    out.push({ start: slots[i].t, end: slots[i].t + n * SLOT, avg: s / tot, cost: profile ? s / 100 : null });
  }
  return out;
}
function minBy(arr, f) { let b = null; for (const x of arr) if (!b || f(x) < f(b)) b = x; return b; }
function maxBy(arr, f) { let b = null; for (const x of arr) if (!b || f(x) > f(b)) b = x; return b; }
function mean(xs) { return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null; }

function analyse(allSlots, now) {
  const nowSlot = Math.floor(now / SLOT) * SLOT;
  const up = allSlots.filter(s => s.t >= nowSlot);
  const hist = allSlots.filter(s => s.t < nowSlot && s.t >= nowSlot - 7 * DAY);
  const weekAvg = mean(hist.map(s => s.p));
  const current = allSlots.find(s => s.t === nowSlot) || null;

  // Dishwasher: Eco 50, 3h15m = 13 slots
  const wDish = windows(up, 13, APPLIANCES.dish);
  const dish = wDish.length ? {
    best: minBy(wDish, w => w.cost), worst: maxBy(wDish, w => w.cost),
    now: wDish.find(w => w.start === nowSlot) || null,
  } : null;

  // Laundry: 40 °C, 1h30m = 6 slots; compare with cheapest run in the past week
  const wLaundry = windows(up, 6, APPLIANCES.laundry);
  const wLaundryHist = windows(hist, 6, APPLIANCES.laundry);
  const laundry = wLaundry.length ? {
    best: minBy(wLaundry, w => w.cost), worst: maxBy(wLaundry, w => w.cost),
    weekBest: minBy(wLaundryHist, w => w.cost),
  } : null;

  // Dinner: 1h starting 17:00–20:00 Helsinki time, per evening
  const inEvening = w => { const a = hk(w.start); const mins = a.h * 60 + a.m; return mins >= 17 * 60 && mins <= 20 * 60; };
  const wDinner = windows(up, 4, APPLIANCES.dinner).filter(inEvening);
  const evenings = {};
  for (const w of wDinner) { const k = hk(w.start).key; (evenings[k] = evenings[k] || []).push(w); }
  const dinner = Object.keys(evenings).sort().map(k => ({ key: k, best: minBy(evenings[k], w => w.cost), worst: maxBy(evenings[k], w => w.cost) }));
  const histDinners = windows(hist, 4, APPLIANCES.dinner).filter(inEvening);
  const dinnerWeekAvgCost = mean(histDinners.map(w => w.cost));
  const dinnerWeekAvg = mean(histDinners.map(w => w.avg));

  // Charging: the night 00:00–08:00 (the current one before 08:00, otherwise the next one)
  const nowA = hk(now);
  const nightKey = nowA.h < 8 ? nowA.key : hk(now + DAY).key;
  const nightSlots = allSlots.filter(s => { const a = hk(s.t); return a.key === nightKey && a.h < 8; });
  const nightDone = nightSlots.length && hk(nightSlots[nightSlots.length - 1].t).hm === "07:45" && hk(nightSlots[0].t).hm === "00:00";
  const charge = nightDone ? {
    start: nightSlots[0].t, end: nightSlots[nightSlots.length - 1].t + SLOT,
    avg: mean(nightSlots.map(s => s.p)),
    weekNightAvg: mean(hist.filter(s => hk(s.t).h < 8).map(s => s.p)),
  } : null;

  // Bad days: most expensive 8h block, plus per-day averages
  const w32 = windows(up, 32);
  const worst8 = w32.length ? maxBy(w32, w => w.avg) : null;
  const byDay = {};
  for (const s of allSlots) { if (s.t < nowSlot - DAY) continue; const k = hk(s.t).key; (byDay[k] = byDay[k] || []).push(s.p); }
  const todayKey = hk(now).key;
  const days = Object.keys(byDay).sort().filter(k => k >= todayKey && byDay[k].length >= 88)
    .map(k => ({ key: k, avg: mean(byDay[k]), max: Math.max(...byDay[k]) }));

  return { nowSlot, up, hist, weekAvg, current, dish, laundry, dinner, dinnerWeekAvg, dinnerWeekAvgCost, charge, worst8, days,
           histDays: hist.length / 96, lastSlot: allSlots.length ? allSlots[allSlots.length - 1].t + SLOT : null };
}

// Price level relative to the past week (fallback: absolute thresholds)
function level(p, ref) {
  if (ref != null && ref > 0.5) {
    const r = p / ref;
    if (r < 0.75) return ["good", "Cheap"];
    if (r < 1.25) return ["mid", "Normal"];
    if (r < 1.75) return ["warn", "High"];
    return ["bad", "Very high"];
  }
  if (p < 3) return ["good", "Cheap"];
  if (p < 8) return ["mid", "Normal"];
  if (p < 15) return ["warn", "High"];
  return ["bad", "Very high"];
}
if (typeof module !== "undefined") module.exports = { SLOT, DAY, eurMwhToCents, hk, toSlots, windows, analyse, level, APPLIANCES };
</script>

<script>
/* ===== Data loading ===== */
const CACHE_KEY = "hsp-prices-v2";
let selected = "dish";
let last = null;

function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function recall(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } }

async function fetchJson(url, ms = 12000) {
  const ctl = new AbortController(); const id = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(id); }
}

// spot-hinta.fi: today + tomorrow in 15-minute steps, €/kWh without VAT
async function fromSpotHinta() {
  const j = await fetchJson("https://api.spot-hinta.fi/TodayAndDayForward");
  const m = new Map();
  for (const r of (Array.isArray(j) ? j : [])) m.set(Date.parse(r.DateTime), eurMwhToCents(r.PriceNoTax * 1000));
  return m;
}
// sahkotin.fi: hourly €/MWh without VAT, used for the past week (each hour fills four 15-min slots)
async function fromSahkotin(now) {
  const start = new Date(now - 8 * DAY).toISOString(), end = new Date(now + 3 * DAY).toISOString();
  const j = await fetchJson(`https://sahkotin.fi/prices?start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
  const m = new Map();
  for (const r of (j.prices || [])) {
    const t = Date.parse(r.date);
    for (let s = t; s < t + 60 * 60 * 1000; s += SLOT) m.set(s, eurMwhToCents(r.value));
  }
  return m;
}

async function load() {
  const now = Date.now();
  const merged = new Map();
  const [sk, sh] = await Promise.allSettled([fromSahkotin(now), fromSpotHinta()]);
  if (sk.status === "fulfilled") for (const [t, p] of sk.value) merged.set(t, p);
  const cached = recall(CACHE_KEY) || [];
  for (const [t, p] of cached) if (t > now - 10 * DAY) merged.set(t, p); // earlier 15-min prices beat hourly ones
  if (sh.status === "fulfilled") for (const [t, p] of sh.value) merged.set(t, p);
  const sources = [sh.status === "fulfilled" && sh.value.size ? "spot-hinta.fi" : null, sk.status === "fulfilled" && sk.value.size ? "sahkotin.fi" : null].filter(Boolean);
  // Only 15-minute prices go into the saved history
  const keep = new Map(cached.filter(([t]) => t > now - 10 * DAY));
  if (sh.status === "fulfilled") for (const [t, p] of sh.value) keep.set(t, p);
  store(CACHE_KEY, [...keep.entries()]);
  const errors = [];
  if (sh.status === "rejected") errors.push(`spot-hinta.fi: ${describe(sh.reason)}`);
  if (sk.status === "rejected") errors.push(`sahkotin.fi: ${describe(sk.reason)}`);
  return { slots: toSlots(merged), sources, now, errors };
}
function describe(e) {
  if (!e) return "unknown error";
  if (e.name === "AbortError") return "timed out after 12 s";
  return `${e.name || "Error"}: ${e.message || e}`;
}
// Record anything the host's Content Security Policy blocks, so the error box can name it
const cspBlocks = [];
document.addEventListener("securitypolicyviolation", e => {
  cspBlocks.push(`${e.effectiveDirective || e.violatedDirective} blocked ${e.blockedURI || "a request"}`);
});
function diagnostics(errors) {
  const parts = [...(errors || [])];
  if (cspBlocks.length) parts.push("Site security policy: " + [...new Set(cspBlocks)].join("; "));
  if (navigator.onLine === false) parts.push("Browser reports it is offline");
  parts.push(`Page address: ${location.origin}`);
  return parts.join(" · ");
}

/* ===== Formatting ===== */
const c2 = p => p.toFixed(2);
function money(eur) {
  const a = Math.abs(eur);
  return a < 1 ? `${(a * 100).toFixed(a * 100 < 10 ? 1 : 0)} c` : `€${a.toFixed(2)}`;
}
function when(t, now) {
  const a = hk(t), today = hk(now).key, tom = hk(now + DAY).key;
  const d = a.key === today ? "Today" : a.key === tom ? "Tomorrow" : a.wd;
  return `${d} ${a.hm}`;
}
function dayName(key, now) {
  if (key === hk(now).key) return "Today";
  if (key === hk(now + DAY).key) return "Tomorrow";
  const [y, m, d] = key.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12)).toLocaleDateString("en-GB", { weekday: "long", timeZone: "UTC" });
}
const range = (w, now) => `${when(w.start, now)}–${hk(w.end).hm}`;
function chip(p, ref) { const [cls, txt] = level(p, ref); return `<span class="chip lv-${cls}">${txt}</span>`; }
function costRow(label, eurDiff) {
  if (eurDiff == null) return "";
  const cls = eurDiff >= 0 ? "pos" : "negv";
  const txt = Math.abs(eurDiff) < 0.0005 ? "same" : `${eurDiff >= 0 ? "save" : "costs"} ${money(Math.abs(eurDiff))}`;
  return `<div class="row"><span>${label}</span><span class="${cls}">${txt}</span></div>`;
}
const fmtKwh = prof => kwhOf(prof).toFixed(kwhOf(prof) < 1 ? 2 : 1);

/* ===== Render ===== */
function render() {
  if (!last) return;
  const { slots, sources } = last;
  const n = Date.now();
  const A = analyse(slots, n);
  const cards = [];

  // Now
  if (A.current) {
    document.getElementById("nowPrice").textContent = c2(A.current.p);
    document.getElementById("nowChip").innerHTML = chip(A.current.p, A.weekAvg) + (A.weekAvg != null ? ` <span class="sub">week avg <span class="num">${c2(A.weekAvg)}</span></span>` : "");
  }

  // Dishwasher
  if (A.dish) {
    const { best, worst, now: nw } = A.dish;
    cards.push(card("dish", "Dishwasher", "Eco 50 · 3 h 15 min", `Start ${when(best.start, n)}`,
      `≈ ${money(best.cost)} per run (${fmtKwh(APPLIANCES.dish)} kWh) · done ${hk(best.end).hm}`,
      costRow("vs starting now", nw ? nw.cost - best.cost : null) +
      costRow(`vs worst start (${when(worst.start, n)})`, worst.cost - best.cost), best));
  } else cards.push(emptyCard("dish", "Dishwasher", "Eco 50 · 3 h 15 min"));

  // Laundry
  if (A.laundry) {
    const { best, worst, weekBest } = A.laundry;
    const vsWeek = weekBest ? (best.cost <= weekBest.cost + 0.0005
      ? `<div class="row"><span>Week's cheapest wash (${when(weekBest.start, n)}, ${money(weekBest.cost)})</span><span class="pos">this beats it</span></div>`
      : `<div class="row"><span>Week's cheapest wash (${when(weekBest.start, n)})</span><span>${money(weekBest.cost)}, ${money(best.cost - weekBest.cost)} less</span></div>`) : "";
    cards.push(card("laundry", "Laundry", "40 °C · 1 h 30 min", `Start ${when(best.start, n)}`,
      `≈ ${money(best.cost)} per load (${fmtKwh(APPLIANCES.laundry)} kWh) · ${chip(best.avg, A.weekAvg)}`,
      vsWeek + costRow(`vs worst start (${when(worst.start, n)})`, worst.cost - best.cost), best));
  } else cards.push(emptyCard("laundry", "Laundry", "40 °C · 1 h 30 min"));

  // Dinner
  if (A.dinner.length) {
    const ev = A.dinner[0];
    const rest = A.dinner.slice(1).map(d => `<div class="row"><span>${dayName(d.key, n)}: start ${hk(d.best.start).hm}</span><span class="num">${money(d.best.cost)}</span></div>`).join("");
    const week = A.dinnerWeekAvgCost != null ? costRow("vs last week's average dinner", A.dinnerWeekAvgCost - ev.best.cost) : "";
    cards.push(card("dinner", "Dinner", "Hob + oven · 1 h, 17–21", `${dayName(ev.key, n)}: start ${hk(ev.best.start).hm}`,
      `≈ ${money(ev.best.cost)} at most (${fmtKwh(APPLIANCES.dinner)} kWh) · ${chip(ev.best.avg, A.dinnerWeekAvg ?? A.weekAvg)}`,
      costRow(`vs worst start (${hk(ev.worst.start).hm})`, ev.worst.cost - ev.best.cost) + week + rest, ev.best));
  } else cards.push(emptyCard("dinner", "Dinner", "Hob + oven · 1 h, 17–21", "No evening slots left with known prices. Tomorrow's arrive around 14:00."));

  // Charging overnight
  if (A.charge) {
    const c = A.charge;
    const night = hk(c.start).key === hk(n).key ? "Tonight (now)" : (hk(c.start).key === hk(n + DAY).key ? "Tonight" : dayName(hk(c.start).key, n) + " night");
    const vs = c.weekNightAvg != null ? `<div class="row"><span>Last week's nights</span><span class="num">${c2(c.weekNightAvg)} c/kWh</span></div>` : "";
    cards.push(card("charge", "Charge overnight", "00–08", `${night}: ${c2(c.avg)} c/kWh`,
      `Average for 00:00–08:00 · ${chip(c.avg, c.weekNightAvg ?? A.weekAvg)}`, vs, c));
  } else cards.push(emptyCard("charge", "Charge overnight", "00–08", "Tonight's prices aren't published yet. They arrive around 14:00."));

  // Bad days
  {
    const dayRows = A.days.map(d => `<div class="day"><span>${dayName(d.key, n)} <span class="sub">avg <span class="num">${c2(d.avg)}</span> · peak <span class="num">${c2(d.max)}</span></span></span>${chip(d.avg, A.weekAvg)}</div>`).join("");
    const w = A.worst8;
    const head = w ? `Worst 8 h: ${range(w, n)}` : "Not enough upcoming prices";
    const meta = w ? `Average <span class="num">${c2(w.avg)}</span> c/kWh` + (A.weekAvg != null ? ` · ${(w.avg / A.weekAvg).toFixed(1)}× the week's average` : "") : "";
    cards.push(`<button type="button" class="card${selected === "bad" ? " sel" : ""}" data-id="bad">
      <div class="top"><span class="label">Bad days ahead</span>${w ? chip(w.avg, A.weekAvg) : ""}</div>
      <div class="answer">${head}</div>${meta ? `<div class="meta">${meta}</div>` : ""}
      ${dayRows ? `<div class="rows days">${dayRows}</div>` : ""}</button>`);
  }

  document.getElementById("cards").innerHTML = cards.join("");
  const blocks = { dish: A.dish && A.dish.best, laundry: A.laundry && A.laundry.best, dinner: A.dinner[0] && A.dinner[0].best, charge: A.charge, bad: A.worst8 };
  drawChart(A, blocks[selected], n);
  const names = { dish: "Dishwasher", laundry: "Laundry", dinner: "Dinner", charge: "Overnight charging", bad: "Worst 8 h" };
  document.getElementById("chartSel").textContent = blocks[selected] ? `Highlighted: ${names[selected]} ${range(blocks[selected], n)}` : "Tap a card to highlight its time block";
}

function card(id, label, dur, answer, meta, rows, w) {
  return `<button type="button" class="card${selected === id ? " sel" : ""}" data-id="${id}">
    <div class="top"><span class="label">${label}</span><span class="dur">${dur}</span></div>
    <div class="answer">${answer}</div><div class="meta">${meta}</div>
    ${rows ? `<div class="rows">${rows}</div>` : ""}</button>`;
}
function emptyCard(id, label, dur, msg) {
  return `<button type="button" class="card" data-id="${id}"><div class="top"><span class="label">${label}</span><span class="dur">${dur}</span></div>
    <div class="empty">${msg || "Not enough upcoming prices yet. Tomorrow's arrive around 14:00."}</div></button>`;
}

function drawChart(A, block, n) {
  const svg = document.getElementById("chart");
  const up = A.up;
  if (!up.length) { svg.innerHTML = ""; return; }
  const W = 400, H = 130, padL = 26, padB = 18, padT = 6;
  const cw = W - padL - 2, ch = H - padB - padT;
  const t0 = up[0].t, t1 = up[up.length - 1].t + SLOT;
  const lo = Math.min(0, ...up.map(s => s.p)), hi = Math.max(1, ...up.map(s => s.p));
  const yMax = Math.ceil(hi / 5) * 5, yMin = lo < 0 ? Math.floor(lo) : 0;
  const x = t => padL + (t - t0) / (t1 - t0) * cw;
  const y = p => padT + (yMax - p) / (yMax - yMin) * ch;
  const bw = Math.max(0.6, cw / ((t1 - t0) / SLOT) - 0.3);
  let g = "";
  // grid
  const step = yMax <= 10 ? 2 : yMax <= 25 ? 5 : 10;
  for (let v = yMin; v <= yMax; v += step) g += `<line x1="${padL}" x2="${W - 2}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.6"/><text x="${padL - 4}" y="${y(v) + 3}" font-size="8" text-anchor="end" fill="var(--muted)" font-family="var(--font-num)">${v}</text>`;
  if (block && block.end > t0) { const bs = Math.max(block.start, t0), be = Math.min(block.end, t1); g += `<rect x="${x(bs)}" y="${padT}" width="${x(be) - x(bs)}" height="${ch}" fill="var(--accent-soft)"/>`; }
  for (const s of up) {
    const [cls] = level(s.p, A.weekAvg);
    const col = { good: "var(--good)", mid: "var(--muted)", warn: "var(--warn)", bad: "var(--bad)" }[cls];
    const inB = block && s.t >= block.start && s.t < block.end;
    const top = Math.min(y(s.p), y(0)), h = Math.max(0.5, Math.abs(y(s.p) - y(0)));
    g += `<rect x="${x(s.t)}" y="${top}" width="${bw}" height="${h}" fill="${inB ? "var(--accent)" : col}" opacity="${inB ? 1 : 0.75}"/>`;
  }
  // hour labels every 6h on Helsinki time, plus day changes
  for (let t = Math.ceil(t0 / (60 * 60 * 1000)) * 60 * 60 * 1000; t < t1; t += 60 * 60 * 1000) {
    const a = hk(t);
    if (a.h % 6 !== 0) continue;
    const lab = a.h === 0 ? (a.key === hk(n + DAY).key ? "Tmrw" : a.wd) : `${String(a.h).padStart(2, "0")}`;
    g += `<line x1="${x(t)}" x2="${x(t)}" y1="${padT + ch}" y2="${padT + ch + 3}" stroke="var(--muted)" stroke-width="0.6"/>`;
    g += `<text x="${x(t)}" y="${H - 5}" font-size="8" text-anchor="middle" fill="var(--muted)" font-family="var(--font-num)"${a.h === 0 ? ' font-weight="600"' : ""}>${lab}</text>`;
  }
  g += `<line x1="${x(A.nowSlot)}" x2="${x(A.nowSlot)}" y1="${padT}" y2="${padT + ch}" stroke="var(--fg)" stroke-width="0.8" stroke-dasharray="2 2"/>`;
  svg.innerHTML = g;
}

/* ===== Wiring ===== */
async function refresh() {
  const err = document.getElementById("error");
  const btn = document.getElementById("refresh");
  btn.textContent = "Loading…"; btn.disabled = true;
  try {
    const res = await load();
    if (!res.slots.length) { const e = new Error("no data"); e.errors = res.errors; throw e; }
    last = res; err.hidden = true;
    if (!res.sources.length) { err.hidden = false; showError(err, "Couldn't reach the price services, so these are the last saved prices. Check your connection and tap Refresh.", res.errors); }
    render();
  } catch (e) {
    err.hidden = false;
    showError(err, "Couldn't load prices from spot-hinta.fi or sahkotin.fi. Check your connection and tap Refresh.", e.errors || [`Page: ${describe(e)}`]);
  } finally { btn.textContent = "Refresh"; btn.disabled = false; }
}
function showError(box, msg, errors) {
  box.textContent = "";
  const p = document.createElement("div"); p.textContent = msg;
  const d = document.createElement("div"); d.className = "detail num"; d.textContent = "Details: " + diagnostics(errors);
  box.append(p, d);
}


document.getElementById("cards").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  selected = c.dataset.id; render();
});
document.getElementById("refresh").addEventListener("click", refresh);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
setInterval(() => { if (!document.hidden) refresh(); }, 15 * 60 * 1000);
setInterval(() => { if (!document.hidden) render(); }, 60 * 1000);

const cachedOnly = recall(CACHE_KEY);
if (cachedOnly && cachedOnly.length) { last = { slots: toSlots(new Map(cachedOnly)), sources: [], now: Date.now() }; render(); }
refresh();
</script>
